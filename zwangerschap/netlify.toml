# Netlify build config voor "Benjamin deze week".
#
# Derde Netlify-site uit deze monorepo: base directory = "zwangerschap".
# Geen omgevingsvariabelen nodig. Toegang loopt via de (geheime) sitenaam;
# zoekmachines worden geweerd met X-Robots-Tag en robots.txt.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-cache"

# Vite-bundels hebben een hash in de naam en veranderen dus nooit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
