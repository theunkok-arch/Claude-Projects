<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BTC EMA26 Alerts</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>BTC Futures <span class="accent">EMA26</span></h1>
      <div id="connection-status" class="status-dot connected" title="Connected"></div>
    </header>

    <section id="price-banner">
      <div class="current-price">
        <span class="label">BTCUSDT Perp</span>
        <span id="live-price" class="price">--</span>
      </div>
    </section>

    <section class="timeframe-cards">
      <div class="card" id="card-4h">
        <div class="card-header">
          <span class="tf-badge">4H</span>
          <span id="signal-4h" class="signal">--</span>
        </div>
        <div class="card-body">
          <div class="metric">
            <span class="label">Close</span>
            <span id="close-4h" class="value">--</span>
          </div>
          <div class="metric">
            <span class="label">EMA26</span>
            <span id="ema-4h" class="value">--</span>
          </div>
          <div class="metric">
            <span class="label">Diff</span>
            <span id="diff-4h" class="value">--</span>
          </div>
          <div class="metric">
            <span class="label">Last Cross</span>
            <span id="cross-4h" class="value">--</span>
          </div>
        </div>
        <canvas id="chart-4h" height="120"></canvas>
      </div>

      <div class="card" id="card-1d">
        <div class="card-header">
          <span class="tf-badge">1D</span>
          <span id="signal-1d" class="signal">--</span>
        </div>
        <div class="card-body">
          <div class="metric">
            <span class="label">Close</span>
            <span id="close-1d" class="value">--</span>
          </div>
          <div class="metric">
            <span class="label">EMA26</span>
            <span id="ema-1d" class="value">--</span>
          </div>
          <div class="metric">
            <span class="label">Diff</span>
            <span id="diff-1d" class="value">--</span>
          </div>
          <div class="metric">
            <span class="label">Last Cross</span>
            <span id="cross-1d" class="value">--</span>
          </div>
        </div>
        <canvas id="chart-1d" height="120"></canvas>
      </div>
    </section>

    <section id="alert-log">
      <h2>Alert History</h2>
      <div id="alerts-list">
        <p class="empty-state">No alerts yet. Monitoring...</p>
      </div>
    </section>

    <footer>
      <button id="btn-notify" class="btn">Enable Notifications</button>
      <button id="btn-sound" class="btn btn-secondary">Sound: ON</button>
      <span id="last-update" class="meta">--</span>
    </footer>
  </div>
