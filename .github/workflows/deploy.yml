name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/bitcoin-ema-alerts-b9BPw"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publiceer alleen de app, niet de hele repo: de losse documenten in
      # de root horen niet op een website te staan.
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js icon-180.png icon-512.png _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
